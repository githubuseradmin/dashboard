{% extends "base.html" %}
{% block title %}Sign in - {{ app_name }}{% endblock %}

{% block auth_content %}
<div class="card auth-card">
  <h1 class="auth-card__title">Welcome back</h1>
  <p class="auth-card__subtitle">Sign in to your {{ app_name }} account.</p>

  <form method="post" action="{{ url_for('auth.login') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

    <label class="field">
      <span class="field__label">Email or username</span>
      <input class="field__input" type="text" name="identifier" autocomplete="username"
             value="{{ identifier|default('') }}" required autofocus>
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input class="field__input" type="password" name="password"
             autocomplete="current-password" required>
    </label>

    <button class="btn btn--primary btn--block" type="submit">Sign in</button>
  </form>

  <p class="auth-card__switch">
    New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
